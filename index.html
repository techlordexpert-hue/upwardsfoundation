<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><meta name="theme-color" content="#ffffff">
<title>Upwards Foundation · One Step Up</title><link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--b:#1a6dff;--n:#0b1530;--o:#ff7a1a;--bg:#f5f7fb;--t:#1b2338;--m:#66718a;--c:#fff;--l:#e3e8f2;--g:#12a150;--r:#e11d48}
*{box-sizing:border-box;margin:0}html{color-scheme:light}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;line-height:1.2}
header{position:sticky;top:0;z-index:50;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid var(--l);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 20px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--n);cursor:pointer}.brand img{width:44px;height:44px;border-radius:50%}.brand small{display:block;color:var(--b);font-style:italic;font-weight:600;font-size:11px;letter-spacing:.15em}
nav{display:flex;gap:4px}nav a,#dr a{padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;color:var(--m);cursor:pointer;transition:.25s;text-decoration:none}nav a:hover{background:#eef3ff;color:var(--b)}nav a.on{background:var(--b);color:#fff}
.right{justify-self:end;display:flex;gap:8px;align-items:center}.burger{display:none;background:none;border:0;padding:6px;cursor:pointer;border-radius:12px}.burger:active{background:#eef3ff}
#ov{position:fixed;inset:0;background:#0b153099;opacity:0;pointer-events:none;transition:.3s;z-index:70}#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(82vw,320px);background:#fff;z-index:80;transform:translateX(105%);transition:transform .3s;padding:16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;box-shadow:-10px 0 30px #0003}#dr.on{transform:none}
#dr a{font-size:16px;padding:14px 16px;border-radius:14px}#dr a.on{background:var(--b);color:#fff}#dr a:active{background:#eef3ff}
.btn{background:var(--b);color:#fff;border:0;padding:11px 18px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;transition:.25s;text-decoration:none;display:inline-block;text-align:center}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #1a6dff44}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.o{background:var(--o)}.btn.d{background:var(--n)}.btn.r{background:var(--r)}.btn.g{background:var(--g)}.btn.s{padding:6px 10px;font-size:12px;border-radius:8px}.btn.w{background:#fff;color:var(--b);border:1px solid var(--l)}
main{max-width:1100px;margin:0 auto;padding:22px 16px 90px;animation:up .5s ease}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:22px;margin-bottom:18px;transition:.3s}.card:hover{box-shadow:0 10px 30px #0b153014}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
label{display:block;font-size:12px;font-weight:700;color:var(--m);text-transform:uppercase;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid #cfd7e6;border-radius:12px;font:inherit;background:#fff!important;color:#1b2338!important;-webkit-text-fill-color:#1b2338;min-height:46px;appearance:auto}
input::placeholder,textarea::placeholder{color:#9aa5bd;-webkit-text-fill-color:#9aa5bd;opacity:1}option{color:#1b2338;background:#fff}
input:-webkit-autofill{-webkit-text-fill-color:#1b2338;box-shadow:0 0 0 40px #fff inset}
input:focus,select:focus,textarea:focus{outline:2px solid #1a6dff55;border-color:var(--b)}
.pw{position:relative}.pw input{padding-right:48px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;cursor:pointer;padding:8px}
.slider{position:relative;border-radius:24px;overflow:hidden;height:min(60vw,430px);background:var(--n);margin-bottom:18px;touch-action:pan-y}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s;display:flex;align-items:flex-end;pointer-events:none}.slide.on{opacity:1;pointer-events:auto}.slide img,.slide video,.slide iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.cap{position:relative;padding:60px 28px 30px;width:100%;color:#fff;background:linear-gradient(transparent,#000b)}.cap h2{font-size:clamp(20px,4vw,34px)}
.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:#ffffff40;color:#fff;font-size:26px;cursor:pointer;backdrop-filter:blur(6px)}.arr.l{left:10px}.arr.r{right:10px}
.dots{position:absolute;bottom:10px;right:16px;display:flex;gap:6px;z-index:3}.dots i{width:9px;height:9px;border-radius:9px;background:#fff8;cursor:pointer;transition:.3s}.dots i.on{background:var(--o);width:24px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:#eef3ff;color:var(--b);font-size:12px;font-weight:700}.tag.g{background:#e3f7ec;color:var(--g)}.tag.y{background:#fff3dc;color:#b86e00}.tag.r{background:#ffe6ec;color:var(--r)}
.exec{text-align:center;padding:24px 16px}.exec img,.ph{width:130px;height:130px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 3px var(--o),0 10px 24px #0b153030;margin:0 auto 12px;display:block;background:#e3e8f2}
.stat{font-size:26px;font-weight:800;font-family:'Space Grotesk'}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--m);padding:8px;white-space:nowrap}td{padding:8px;border-top:1px solid var(--l);vertical-align:middle}.sc{overflow-x:auto}
.idc{max-width:340px;margin:auto;background:linear-gradient(160deg,#0b1530,#1a3a8f);color:#fff;border:2px solid #c9923a;border-radius:24px;padding:24px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}.idc img.p{width:150px;height:170px;object-fit:cover;border-radius:18px;border:3px solid #e0a73c}.idc b{color:#ffc94a}.idc .r{text-align:left;font-size:13px;margin-top:6px}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}.sub a{white-space:nowrap;padding:9px 15px;border-radius:12px;background:#fff;border:1px solid var(--l);font-weight:600;font-size:13px;cursor:pointer}.sub a.on{background:var(--n);color:#fff}
.steps{display:flex;align-items:center;justify-content:center;margin:18px 0}.steps b{width:42px;height:42px;border-radius:50%;background:#eef1f7;color:var(--m);display:grid;place-items:center;transition:.3s}.steps b.on{background:var(--o);color:#fff;box-shadow:0 0 0 6px #ff7a1a33}.steps b.done{background:var(--g);color:#fff}.steps s{width:60px;height:3px;background:var(--l);transition:.3s}.steps s.done{background:var(--g)}
.pbox{width:200px;height:200px;margin:14px auto;border-radius:24px;background:#e3e8f2;display:grid;place-items:center;overflow:hidden;color:#8a96b0;font-weight:700;font-size:12px;text-align:center}.pbox img{width:100%;height:100%;object-fit:cover}
.stack{display:grid;gap:10px;max-width:420px;margin:0 auto}.row2{display:flex;gap:10px;margin-top:20px}.row2 .btn{flex:1}
.wa{position:fixed;right:18px;bottom:18px;z-index:60;width:60px;height:60px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 8px 24px #25d36688;animation:pulse 2.4s infinite}.wa svg{width:34px;height:34px;fill:#fff}@keyframes pulse{50%{transform:scale(1.07)}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--n);color:#fff;padding:12px 20px;border-radius:12px;z-index:120;animation:up .3s;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:#0b1530b0;z-index:100;display:grid;place-items:center;padding:14px;overflow:auto}.modal>.card{max-width:440px;width:100%;max-height:92vh;overflow:auto;margin:0}
footer{background:var(--n);color:#9fb0d0;text-align:center;padding:36px 16px;font-size:14px}footer b{color:var(--o)}
.hero{background:linear-gradient(135deg,var(--n),#16348a);color:#fff;border-radius:24px;padding:30px}.hero p{color:#c4d2f2}
@media(max-width:860px){header{grid-template-columns:1fr auto}nav,#acct{display:none}.burger{display:block}.brand span{font-size:14px}.steps s{width:34px}}
@media print{body.pc>*{display:none!important}body.pc>.modal{display:block!important;position:static!important;background:none!important}body.pc .noprint{display:none!important}
body.ps header,body.ps footer,body.ps .wa,body.ps main>*{display:none!important}body.ps main>#ab{display:block!important}body.ps #ab>*:not(#st){display:none!important}body.ps #st{border:0}}
</style></head><body>
<header><div class="brand" onclick="go('home')"><img src="/logo.png" alt="Upwards Foundation"><span>UPWARDS FOUNDATION<small>ONE STEP UP</small></span></div>
<nav id="nav"></nav><div class="right"><a class="btn d s" id="acct" onclick="go('admin')" style="padding:9px 14px;font-size:13px">🔒 Admin</a>
<button class="burger" aria-label="Open menu" onclick="menu(1)"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button></div></header>
<div id="ov" onclick="menu(0)"></div><aside id="dr"></aside>
<main id="app"><p style="text-align:center;color:var(--m);padding:60px">Loading…</p></main>
<a class="wa" id="wa" href="https://whatsapp.com/channel/0029VbBZ3uo9mrGcpe6tBN40" target="_blank" rel="noopener" aria-label="WhatsApp channel"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>
<footer><b>Upwards Foundation</b><br>Empowering communities, supporting welfare and raising lives one step at a time.<br><i>Winneba &amp; Takoradi, Ghana</i><br>© <span id="yr"></span> Upwards Foundation</footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tok=sessionStorage.tok||'',role=sessionStorage.role||'',P={news:[],slides:[],execs:[],settings:{},stats:{}},D=null,sec='overview',timer,rid=0,exEdit=null,payF='all';
const TABS=[['home','Home'],['register','Register'],['pay','Pay Dues'],['news','News'],['about','About'],['support','Support']],V={};
const img=id=>!id?'':/^(https?:|data:)/.test(id)?id:'/api?a=img&id='+id;
async function api(a,body,q=''){let r,j;try{r=await fetch('/api?a='+a+q,{method:body?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:body?JSON.stringify(body):undefined,cache:'no-store'})}catch{throw new Error('Network error — check your internet connection')}
 try{j=await r.json()}catch{throw new Error('Server error ('+r.status+'). The API may not be deployed correctly.')}
 if(!r.ok){const e=new Error(j.error||'Request failed');e.status=r.status;throw e}return j}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3800)}
const logout=()=>{tok=role='';sessionStorage.clear();route()};
const run=async(f,ok,btn)=>{const t=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='Please wait…'}
 try{await f();ok&&toast(ok)}catch(e){if(e.status==401&&tok){logout();toast('Session expired — please log in again')}else toast('⚠ '+e.message)}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=t}}};
const toURL=f=>typeof f=='string'?Promise.resolve(f):new Promise((ok,no)=>{const x=new FileReader();x.onload=()=>ok(x.result);x.onerror=()=>no(new Error('Could not read file'));x.readAsDataURL(f)});
async function shrink(f,max=700,q=.78){const u=await toURL(f);return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};i.onerror=()=>no(new Error('That file is not a valid image'));i.src=u})}
const upData=async d=>(await api('up',{data:d})).id,upload=async(f,max,q)=>upData(await shrink(f,max,q));
function go(p){menu(0);if(location.hash=='#'+p)route();else location.hash=p}
function menu(o){$('#dr').classList.toggle('on',!!o);$('#ov').classList.toggle('on',!!o);document.body.style.overflow=o?'hidden':''}
const eye=b=>{const i=b.previousElementSibling;i.type=i.type=='password'?'text':'password';b.textContent=i.type=='password'?'👁':'🙈'};
const pwf=(n,ac='new-password',req=1)=>`<div class="pw"><input name="${n}" type="password" autocomplete="${ac}" ${req?'required':''}><button type="button" onclick="eye(this)" aria-label="Show or hide password">👁</button></div>`;
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${h}<br><button class="btn w" style="width:100%;margin-top:8px" onclick="this.closest('.modal').remove()">Close</button></div>`;m.onclick=e=>e.target==m&&m.remove();document.body.append(m)}
const pc=()=>{document.body.classList.add('pc');print();setTimeout(()=>document.body.classList.remove('pc'),800)},ps=()=>{document.body.classList.add('ps');print();setTimeout(()=>document.body.classList.remove('ps'),800)};
const gr=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
async function loadPub(){P=await api('pub');$('#wa').href=P.settings.whatsapp||$('#wa').href}
async function route(){const id=++rid,p=(location.hash||'#home').slice(1);clearInterval(timer);menu(0);
 const ls=TABS.map(([k,l])=>`<a class="${p==k?'on':''}" onclick="go('${k}')">${l}</a>`).join('');
 $('#nav').innerHTML=ls;$('#acct').textContent=role?'👤 '+(role=='admin'?'Admin':'Treasurer'):'🔒 Admin';
 $('#dr').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="brand"><img src="/logo.png" alt=""><span>UPWARDS<small>ONE STEP UP</small></span></div><button class="burger" style="display:block" onclick="menu(0)" aria-label="Close menu"><svg width="28" height="28" viewBox="0 0 24 24" stroke="#222" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${ls}<a class="${p=='admin'?'on':''}" onclick="go('admin')">🔒 ${role?(role=='admin'?'Admin':'Treasurer')+' Dashboard':'Admin Login'}</a><a href="${esc(P.settings.whatsapp||'https://whatsapp.com/channel/0029VbBZ3uo9mrGcpe6tBN40')}" target="_blank" rel="noopener">💬 WhatsApp Channel</a>`;
 if(p!='admin'){try{await loadPub()}catch(e){toast('⚠ '+e.message)}}
 if(id!==rid)return;const m=$('#app');m.style.animation='none';m.offsetHeight;m.style.animation='';(V[p]||V.home)(m);scrollTo(0,0)}
/* ---------- HOME ---------- */
V.home=m=>{const S=P.slides.length?P.slides:['Welcome to Upwards Foundation|One step up, one community at a time','Community Outreach|Supporting welfare in Winneba & Takoradi','Together We Rise|Join a growing family of changemakers','Events & Workshops|Learn, connect and grow with us'].map((x,i)=>({g:i,caption:x.split('|')[0],sub:x.split('|')[1]}));
 const media=s=>{if(s.type=='video'){const y=((s.src||'').match(/(?:v=|be\/|embed\/)([\w-]{11})/)||[])[1];return y?`<iframe src="https://www.youtube.com/embed/${y}?autoplay=1&mute=1&loop=1&playlist=${y}&controls=0" allow="autoplay;encrypted-media" loading="lazy"></iframe>`:`<video src="${esc(s.src)}" muted loop playsinline autoplay></video>`}return s.src?`<img src="${esc(img(s.src))}" alt="${esc(s.caption)}" onerror="this.remove()">`:''};
 const bg=['#0b1530,#1a6dff','#16348a,#ff7a1a','#0b1530,#12a150','#1a6dff,#0b1530'];
 m.innerHTML=`<div class="slider">${S.map((s,i)=>`<div class="slide ${i?'':'on'}" ${s.g!=null?`style="background:linear-gradient(135deg,${bg[s.g%4]})"`:''}>${media(s)}<div class="cap"><h2>${esc(s.caption)}</h2><p>${esc(s.sub||'')}</p></div></div>`).join('')}${S.length>1?`<button class="arr l" aria-label="Previous">‹</button><button class="arr r" aria-label="Next">›</button>`:''}<div class="dots">${S.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></div>
 <div class="grid"><div class="card hero"><h2>Become a Member</h2><p style="margin:8px 0 16px">Register in minutes and receive your official membership ID card with passport photo.</p><a class="btn o" onclick="go('register')">Register Member →</a></div><div class="card hero" style="background:linear-gradient(135deg,#ff7a1a,#e0580a)"><h2>Pay Monthly Dues</h2><p style="margin:8px 0 16px;color:#fff">Dues are GHS ${esc(P.settings.dues||10)} per month via MTN MoMo. Every payment is verified by the admin.</p><a class="btn d" onclick="go('pay')">Pay Dues →</a></div></div>
 <div class="card"><h3>Latest news</h3>${P.news.slice(-3).reverse().map(n=>`<p style="margin-top:10px"><span class="tag">${esc(n.cat)}</span> <b>${esc(n.title)}</b></p>`).join('')||'<p style="color:var(--m)">No news yet.</p>'}</div>`;
 const sl=[...m.querySelectorAll('.slide')],dt=[...m.querySelectorAll('.dots i')];let c=0;
 const show=n=>{sl[c].classList.remove('on');dt[c].classList.remove('on');c=(n+sl.length)%sl.length;sl[c].classList.add('on');dt[c].classList.add('on')};
 const reset=()=>{clearInterval(timer);if(sl.length>1)timer=setInterval(()=>show(c+1),5000)};
 dt.forEach((d,i)=>d.onclick=()=>{show(i);reset()});const L=m.querySelector('.arr.l'),R=m.querySelector('.arr.r');if(L){L.onclick=()=>{show(c-1);reset()};R.onclick=()=>{show(c+1);reset()}}
 let x0=0;const sd=m.querySelector('.slider');sd.ontouchstart=e=>x0=e.touches[0].clientX;sd.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40){show(c+(d<0?1:-1));reset()}};reset()};
/* ---------- REGISTER (3-step wizard) ---------- */
V.register=m=>{let st=1;const R={gender:'Male',location:'Winneba'},v=n=>esc(R[n]||'');
 const draw=()=>{const bar=`<div class="steps">${[1,2,3].map(i=>`<b class="${i<st?'done':i==st?'on':''}">${i<st?'✓':i}</b>${i<3?`<s class="${i<st?'done':''}"></s>`:''}`).join('')}</div>`;

 if(sec=='news'){B.innerHTML=`<div class="card"><h3>News &amp; notices</h3>${tbl(['Title','Cat','Date',''],D.news.map(n=>[esc(n.title),esc(n.cat),esc(n.date),`<button class="btn w s" onclick="__set('news','${n.id}',{pinned:${!n.pinned}})">${n.pinned?'Unpin':'Pin'}</button> `+dl('news',n.id)]))}</div><div class="card"><h3>Publish</h3>${fm([['cat','Category','select',['Announcement','Event','Financial','Project']],['title','Title*'],['body','Body*','area'],['pinned','Pin?','check']],'nf','Publish')}</div>`;bind('nf',o=>api('op',{c:'news',t:'add',d:{...o,pinned:!!o.pinned,date:new Date().toISOString().slice(0,10)}}),'Published')}
 if(sec=='execs'){const e0=D.execs.find(x=>x.id==exEdit);B.innerHTML=`<div class="card"><h3>Executives</h3>${tbl(['','Name','Position',''],D.execs.map(e=>[e.photo?`<img src="${esc(img(e.photo))}" width="46" height="46" style="border-radius:50%;object-fit:cover" alt="">`:'',esc(e.name),esc(e.position),`<button class="btn w s" onclick="exEdit='${e.id}';route()">✏ Edit</button> `+dl('execs',e.id)]))}</div><div class="card"><h3>${e0?'Edit executive — '+esc(e0.name):'Add executive'}</h3>${fm([['name','Full name*'],['position','Position*'],['photo',e0?'Replace photo (optional)':'Photo','file'],['bio','Short bio']],'xf',e0?'Save changes':'Add executive')}${e0?'<button class="btn w s" style="margin-top:10px" onclick="exEdit=null;route()">Cancel edit</button>':''}</div>`;
  if(e0)['name','position','bio'].forEach(k=>$('#xf').elements[k].value=e0[k]||'');
  bind('xf',async o=>{if(e0){await api('op',{c:'execs',t:'set',id:e0.id,d:{name:o.name,position:o.position,bio:o.bio,...(o.photo?{photo:o.photo}:{})}});exEdit=null}else await api('op',{c:'execs',t:'add',d:o})},e0?'Executive updated':'Executive added')}
 if(sec=='inbox')B.innerHTML=D.messages.length?[...D.messages].reverse().map(x=>`<div class="card"><b>${esc(x.name)}</b> ${x.read?'':'<span class="tag y">new</span>'} · ${esc(x.phone)} · ${esc(x.email)}<br><small>${esc((x.date||'').slice(0,16).replace('T',' '))}</small><h3>${esc(x.subject)}</h3><p style="white-space:pre-wrap">${esc(x.message)}</p><br>${x.read?'':`<button class="btn w s" onclick="__set('messages','${x.id}',{read:true})">Mark read</button> `}${dl('messages',x.id)}</div>`).join(''):'<div class="card">No messages yet.</div>';
 if(sec=='sms'){B.innerHTML=`${D.bms?'':'<div class="card" style="background:#ffe6ec;border-color:var(--r)">⚠ <b>BMS is not configured.</b> Add <code>BMS_API_KEY</code> and <code>BMS_API_URL</code> in Vercel → Settings → Environment Variables, then redeploy.</div>'}<div class="card"><h3>Bulk SMS (BMS)</h3><p style="color:var(--m)">Bulk sends go to all <b>active</b> members. Send a test first to check the connection.</p><form id="mf"><label>Recipients</label><select id="rt"><option value="all">All active members</option><option value="x">Specific numbers</option></select><input id="nums" placeholder="024..., 055..." style="display:none;margin-top:8px"><label>Message</label><textarea id="msg" rows="4" maxlength="640" required></textarea><small id="cnt" style="color:var(--m)">0/640</small><br><br><button class="btn o">Send SMS</button> <button type="button" class="btn w" id="tst">Send test to one number</button></form><pre id="out" style="white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f5f7fb;padding:10px;border-radius:10px;margin-top:12px;display:none"></pre></div>`;
  $('#rt').onchange=e=>$('#nums').style.display=e.target.value=='x'?'block':'none';$('#msg').oninput=e=>$('#cnt').textContent=e.target.value.length+'/640';
  const send=async(to,btn)=>{if(!$('#msg').value.trim())return toast('⚠ Type a message first');run(async()=>{const r=await api('sms',{to,message:$('#msg').value});$('#out').style.display='block';$('#out').textContent=`Recipients: ${r.sent}\nProvider HTTP ${r.status} (${r.ok?'accepted':'REJECTED'})\n${r.provider}`;toast(r.ok?'✅ SMS request accepted by BMS':'⚠ BMS rejected the request — see details below')},null,btn)};
  $('#mf').onsubmit=e=>{e.preventDefault();const to=$('#rt').value=='all'?'all':$('#nums').value;if(to=='all'&&!confirm('Send this SMS to ALL active members?'))return;send(to,e.submitter)};
  $('#tst').onclick=e=>{const n=prompt('Phone number for the test SMS (e.g. 0241234567)');if(n)send(n,e.target)}}
 if(sec=='settings'){const s=D.settings;B.innerHTML=`<div class="card"><h3>Foundation settings</h3>${fm([['momoName','MoMo account name*'],['momoNumber','MoMo number*'],['dues','Monthly dues (GHS)*','number'],['regFee','Registration fee (GHS)*','number'],['whatsapp','WhatsApp channel link*']],'sf2')}</div>
  <div class="card"><h3>🔑 Change MY password (Admin)</h3>${fm([['current','Current admin password*','password'],['password','New password* (8+ characters)','password'],['again','Confirm new password*','password']],'pa','Change admin password')}</div>
  <div class="card"><h3>🔑 Reset TREASURER password (Frema)</h3><p style="color:var(--m);font-size:14px">Only you can change this. The treasurer cannot change her own password. She will be logged out.</p>${fm([['current','Your admin password* (to confirm)','password'],['password','New treasurer password* (8+ characters)','password'],['again','Confirm new password*','password']],'pt','Reset treasurer password')}</div>`;
  [...$('#sf2').elements].forEach(i=>i.name&&(i.value=s[i.name]??''));
  bind('sf2',async o=>{await api('settings',o);await loadPub()},'Settings saved');
  const chg=who=>async o=>{if(o.password!==o.again)throw new Error('The new passwords do not match');await api('pw',{who,current:o.current,password:o.password});if(who=='admin'){logout();toast('Password changed — please log in again')}};
  bind('pa',chg('admin'),'Admin password updated');bind('pt',chg('treasurer'),'Treasurer password updated')}
};
addEventListener('hashchange',route);$('#yr').textContent=new Date().getFullYear();route();
</script></body></html>
